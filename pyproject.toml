[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_kit"
version = "0.1.0"
description = "Klaaryo mini kit for the intern technical assessment"
authors = [{ name = "Klaaryo", email = "tech@klaaryo.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6",
    "djangorestframework>=3.16,<4",
    "PyJWT>=2.10,<3",
]

[project.urls]
Repository = "https://github.com/zwapin/mini_kit"

[project.optional-dependencies]
dev = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["mini_kit*"]
